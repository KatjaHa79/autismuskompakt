title: "Autismus kompakt"
subtitle: "Orientierung, Alltagstipps & Hilfen"
description: >
  „Autismus kompakt“ bietet Orientierung und praktische Unterstützung rund
  um Autismus. Das Buch richtet sich an autistische Menschen, Angehörige,
  Fachkräfte und Arbeitgeber und verbindet verständlich aufbereitetes
  Wissen mit konkreten Hilfen für den Alltag. Checklisten, Fallbeispiele,
  Reflexionsaufgaben und praxisnahe Tipps helfen dabei, individuelle
  Bedürfnisse besser zu verstehen, Belastungen einzuordnen und passende
  Unterstützung zu finden.
