title: "Neuro-Kompass"
subtitle: "Dein Praxis-Guide für ein neurodivergentes Leben"
description: >
  „Neuro-Kompass“ ist ein Praxis-Guide für Menschen, die ihre eigene
  Neurodivergenz und ihre individuellen Bedürfnisse besser verstehen
  möchten. Im Mittelpunkt steht nicht die Frage, wie ein Mensch möglichst
  gut in vorgegebene Strukturen passt, sondern welche Bedingungen ihm
  helfen, den eigenen Alltag stimmiger zu gestalten. Das Buch unterstützt
  dabei, persönliche Stärken, Belastungen und Unterstützungsbedarfe
  differenziert zu betrachten und daraus konkrete nächste Schritte
  abzuleiten.
