offer: >
  Eine der vier Berliner Spezialambulanzen für Autismusdiagnostik im
  Erwachsenenalter. Seit Juni 2025 koordinieren diese vier Ambulanzen
  (Humboldt-Universität, Charité Campus Mitte, Charité Campus Benjamin
  Franklin und Evangelisches Krankenhaus Königin Elisabeth Herzberge) die
  Diagnostikplatzvergabe gemeinsam über ein zentrales Verfahren. Die
  Charité weist ausdrücklich darauf hin, dass die Autismus-Sprechstunde
  aktuell keine reguläre Autismus-Therapie oder allgemeine Beratung nach
  gesicherter Diagnose anbietet.
admissionRequirements: >
  Gemeinsames zentrales Anmeldeverfahren aller vier Berliner
  Spezialambulanzen: Anmeldung viermal jährlich am ersten Mittwoch eines
  Quartals über ein zentrales Online-Verfahren. Wegen begrenzter
  Kapazitäten ist die Anmeldung unverbindlich; die Zuteilung erfolgt per
  Zufallsverfahren. Individuelle Standortwünsche werden nicht
  berücksichtigt.

