offer: >
  Einzel- und Gruppenförderung, soziale Kompetenzgruppen, Elternberatung,
  Umfeldarbeit, Beratung, Supervision und Fortbildung für Kinder, Jugendliche
  und Erwachsene mit gesicherter Autismusdiagnose. Medizinische Diagnostik:
  ausdrücklich nein; die Einrichtung verweist an spezialisierte
  (kinder- und jugend-)psychiatrische Stellen.
admissionRequirements: >
  Finanzierung über Eingliederungshilfe (nicht Krankenkasse): für Erwachsene
  und noch nicht schulpflichtige Kinder in der Regel Sozialamt nach SGB IX,
  für schulpflichtige Kinder/Jugendliche häufig Jugendamt nach §35a SGB VIII.
  Zur Aufnahme auf die Warteliste soll ein Fragebogen eingereicht werden.

