city: "Heidelberg"
state: "baden-wuerttemberg"

offer: >
  Sehr ausführliche Diagnostik mit Anamnese, standardisierten Fragebögen,
  Fremdanamnese und bei Bedarf weiteren Untersuchungen sowie
  therapeutische Abschlussberatung für Erwachsene mit Verdacht auf ASS.
  Keine reguläre Autismustherapie als Hauptleistung veröffentlicht.
admissionRequirements: >
  Neue Anmeldungen werden nur von Personen mit Wohnsitz in Heidelberg
  angenommen, Ausnahmen sind ausdrücklich nicht möglich. Kontaktaufnahme
  muss über die behandelnde psychiatrische oder psychotherapeutische
  Fachperson erfolgen (Überweisung erforderlich); Kindheitsinformationen/
  Fremdanamnese ausdrücklich vorgesehen, Schulzeugnisse sofern vorhanden
  erwünscht.

