offer: >
  Umfassende kinder- und jugendpsychiatrische, psychologische und
  neuropsychologische Diagnostik sowie Therapie; tiefgreifende
  Entwicklungsstörungen (einschließlich Autismus) werden ausdrücklich als
  Versorgungsschwerpunkt genannt. Keine eigenständig benannte
  ASS-Spezialsprechstunde auf der aktuellen Ambulanzseite.
admissionRequirements: "Im Regelfall Überweisung vom Kinder- oder Hausarzt. Versichertenkarte, Überweisung, Untersuchungsheft, Zeugnisse und vorhandene Vorbefunde sollen mitgebracht werden."

