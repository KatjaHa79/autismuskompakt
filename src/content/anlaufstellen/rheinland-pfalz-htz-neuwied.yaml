offer: >
  Umfassende interdisziplinäre Diagnostik mit entwicklungsneurologischen,
  psychologischen, ergotherapeutischen und logopädischen Untersuchungen
  sowie Behandlung (Ergotherapie, Logopädie, Physiotherapie, heilpädagogische
  Therapie, medikamentöse Therapie, Beratung) für Kinder und Jugendliche mit
  Entwicklungs-, Verhaltens- oder neurologischen Fragestellungen. Eine
  eigenständig benannte Autismus-Spezialambulanz ist auf der aktuellen
  Leistungsseite nicht ausgewiesen.
admissionRequirements: "Gültiger Überweisungsschein für das laufende Quartal und Krankenversichertenkarte erforderlich."

