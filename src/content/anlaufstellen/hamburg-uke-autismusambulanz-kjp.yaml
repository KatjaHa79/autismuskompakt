offer: >
  Ersteinschätzung bei Verdacht auf ASS für Klein- und Vorschulkinder bis 5
  Jahre, Grundschulkinder 6-10 Jahre sowie Jugendliche/junge Menschen 11-21
  Jahre; bei entsprechender Indikation ausführliche spezifische Diagnostik,
  Beratung und Begleitung. Angehörigenberatung auch für Eltern, die selbst
  autistisch sind.

