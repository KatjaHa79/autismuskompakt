offer: >
  Einzel- und Gruppentherapie, Beratung (einschließlich Vorwegberatung ohne
  therapeutische Anbindung), Jobcoaching und Förderdiagnostik für Kinder,
  Jugendliche und Erwachsene im Autismus-Spektrum sowie Angehörige, Schulen,
  Arbeitgeber und weitere Bezugspersonen. Medizinische Erstdiagnostik nicht
  als eigene Leistung ausgewiesen.
