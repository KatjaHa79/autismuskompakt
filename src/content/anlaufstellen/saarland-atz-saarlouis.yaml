offer: >
  Autismusspezifische Therapie/Förderung und Beratung für Menschen jeden
  Alters mit fachärztlich bestätigter Autismusdiagnose. Medizinische
  Erstdiagnostik: nein; das Zentrum erklärt selbst, dass die Diagnostik bei
  Kindern/Jugendlichen in spezialisierten KJP-Fachkliniken und bei
  Erwachsenen in spezialisierten psychiatrischen Kliniken erfolgt.
admissionRequirements: "Autismustherapie ist Eingliederungshilfe und wird ausdrücklich NICHT von der gesetzlichen Krankenversicherung finanziert. Kostenträger sind in der Regel Landesamt für Soziales oder Jugendamt."

