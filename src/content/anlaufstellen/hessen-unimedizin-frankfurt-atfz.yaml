offer: >
  Spezialambulanz mit integriertem Forschungszentrum: autismusspezifische
  Förderung sowie Eltern- und Geschwisterangebote für Kinder und
  Jugendliche mit Autismus-Spektrum-Störung im Alter von 2 bis 18 Jahren.
  Diagnostik: die Diagnostik bei Verdacht erfolgt über die kinder- und
  jugendpsychiatrische Ambulanz, nicht als voraussetzungsloser
  Therapiezugang im ATFZ.
admissionRequirements: "Zugang zur ATFZ-Förderung setzt eine gesicherte Autismusdiagnose voraus; bei schwerer Symptomatik kann zunächst teil- oder vollstationäre Behandlung notwendig sein."

