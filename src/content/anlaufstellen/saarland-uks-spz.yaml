offer: >
  Multiprofessionelle Mehrbereichsdiagnostik, Beratung und Koordination für
  Kinder und Jugendliche von 0 bis 18 Jahren mit Entwicklungsauffälligkeiten,
  chronischen Erkrankungen und Behinderungen. Autismus wird auf den
  aktuellen Schwerpunktseiten nicht als eigener ausgewiesener Schwerpunkt
  genannt; daher keine gesicherte Autismus-Spezialdiagnostik.
admissionRequirements: "Überweisung durch Kinderarzt, Neurologe oder Allgemeinmediziner erforderlich. Ambulante Versorgung nach §119 SGB V zugelassen."

