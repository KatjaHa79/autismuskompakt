offer: >
  Therapie sowie Beratung und Orientierung, auch Angebote für Angehörige
  und Fachkräfte, für Kinder, Jugendliche und Erwachsene mit Autismus oder
  Verdacht. Bei Autismusverdacht bietet das ATB eine Erstberatung; auf
  Wunsch wird auch autismusspezifische Diagnostik in Kooperation mit
  Fachärzt:innen und Partnern beschrieben – daraus lässt sich jedoch nicht
  automatisch für jeden Standort "Diagnostik: ja" ableiten; Diagnostikstatus
  bitte je Standort direkt erfragen.
