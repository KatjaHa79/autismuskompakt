offer: >
  Fachberatung, Elternberatung, Übergangsthemen, Gesprächskreise und
  Vernetzung für Familien und Angehörige, Kinder/Jugendliche, junge
  Erwachsene bis maximal 25 Jahre sowie Fachkräfte; auch Familien mit
  Verdacht auf Autismus können sich melden. Unterstützung bei der
  Diagnostik erfolgt nur auf Anfrage behandelnder Fachärzt:innen bzw. in
  Einzelfällen; keine eigenständige medizinische Diagnostikstelle.
costs: "Die Beratungsangebote werden aus Zuwendungsmitteln des Landes Berlin finanziert und sind laut aktuellem Flyer kostenlos; kein Überweisungsschein erforderlich."

