offer: >
  Sonderpädagogische Unterstützung, Fortbildungen und Beratung zu
  Nachteilsausgleichen und schulischer Teilhabe für Schüler:innen mit
  Autismusdiagnose, Eltern, Schulen, Lehrkräfte und weitere schulische
  Netzwerkpartner. Unterstützt auch bei Autismusverdacht bei
  Ersteinschätzung und Planung des weiteren Vorgehens. Medizinische
  Diagnostik: nein; diese muss durch KJP-Praxis, SPZ oder entsprechende
  Klinik erfolgen.

