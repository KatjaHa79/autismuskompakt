offer: >
  Individuelle autismusspezifische Einzelangebote, systemische
  Familienberatung, Integrationsbegleitung, Sozialtrainingsgruppen,
  Selbsthilfegruppen, Beratung und Fortbildung für Kinder, Jugendliche und
  Erwachsene mit gesicherter Autismusdiagnose. Medizinische Diagnostik durch
  die Autismusambulanz selbst ausdrücklich nein; Erwachsenendiagnostik
  erfolgt getrennt über die angegliederte Psychotherapiepraxis.
admissionRequirements: "Einzugsgebiet südliches Sachsen-Anhalt. Finanzierung in der Regel über Eingliederungshilfe durch Jugend- oder Sozialamt; in Einzelfällen Selbstzahlung möglich."

waitingList: "offen"
waitingTime: "Stand 27.08.2026: nach Diagnose, Antrag und Kostenübernahme erfolgt Aufnahme auf die Warteliste; anschließende Wartezeit von etwa 6 bis 12 Monaten. Die Bedarfsprüfung beim Amt dauert laut FAQ ungefähr 3 Monate."

