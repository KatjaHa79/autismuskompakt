offer: >
  Mehrterminige fachärztliche Autismusdiagnostik unter Einbezug von
  Vorbefunden, ggf. Grundschulzeugnissen und weiterer
  medizinischer/psychologischer Diagnostik für Erwachsene ab 18 Jahren mit
  bereits diagnostiziertem oder vermutetem Autismus, ADHS oder AuDHS.
  Psychiatrisch-medikamentöse Behandlung und Gruppenpsychotherapie im Rahmen
  verfügbarer Kapazitäten.
