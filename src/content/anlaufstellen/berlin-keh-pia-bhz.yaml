offer: >
  Eine der vier Berliner Spezialambulanzen für Autismusdiagnostik im
  Erwachsenenalter. Seit Juni 2025 koordinieren diese vier Ambulanzen
  (Humboldt-Universität, Charité Campus Mitte, Charité Campus Benjamin
  Franklin und Evangelisches Krankenhaus Königin Elisabeth Herzberge) die
  Diagnostikplatzvergabe gemeinsam über ein zentrales Verfahren. Das
  diagnostische Angebot umfasst sowohl Menschen mit
  Intelligenzentwicklungsstörung als auch Menschen mit Normintelligenz.
admissionRequirements: >
  Für Erwachsene mit Normintelligenz erfolgt der Zugang über die zentrale
  Berliner Diagnostikplatzvergabe (Anmeldung viermal jährlich am ersten
  Mittwoch eines Quartals über ein zentrales Online-Verfahren, begrenzte
  Plätze, Zufallszuteilung, individuelle Standortwünsche werden nicht
  berücksichtigt). Menschen mit Intelligenzentwicklungsstörung nutzen die
  regulären PIA-Anmeldeformulare.

