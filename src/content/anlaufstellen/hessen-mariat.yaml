  Emotionsregulation, Selbstständigkeit, Kommunikation und beruflicher
  Wiedereingliederung; Angehörigenberatung und Fortbildungen für
  Fachkräfte. Medizinische Diagnostik nicht durch MarIAT selbst; hierfür
  verweist die Universität auf die UKGM-Spezialambulanz.

