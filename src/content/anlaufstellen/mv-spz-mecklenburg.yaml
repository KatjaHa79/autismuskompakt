offer: >
  Interdisziplinäre Entwicklungs- und Verhaltensdiagnostik für Kinder und
  Jugendliche von Geburt bis zum 18. Lebensjahr mit Entwicklungs- und
  Verhaltensauffälligkeiten, chronischen Erkrankungen oder Behinderungen.
  Diagnostik und Beratung bei Autismus wird als möglicher fachlicher
  Schwerpunkt genannt; eine eigene, öffentlich benannte
  ASS-Spezialsprechstunde ist auf der aktuellen Leistungsseite jedoch nicht
  ausgewiesen.
