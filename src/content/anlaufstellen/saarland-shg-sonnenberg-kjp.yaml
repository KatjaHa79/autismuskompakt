  Für die allgemeine Institutsambulanz ist normalerweise ein
  Überweisungsschein eines Facharztes für Kinder- und Jugendpsychiatrie
  erforderlich – diese Regel gilt ausdrücklich NICHT für die
  Spezialambulanzen einschließlich Autismus.

