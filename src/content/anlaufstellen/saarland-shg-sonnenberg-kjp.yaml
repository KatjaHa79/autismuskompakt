  Diagnostische und therapeutische Versorgung für Kinder und Jugendliche bis
  18 Jahre; die Institutsambulanz weist ausdrücklich eine Spezialambulanz
  "Autismus" aus. Tagesklinische und stationäre Behandlung ebenfalls
  vorhanden.
