offer: >
  Therapie, Beratung, Begleitung und Supervision sowie Fortbildungen und
  Unterstützung bei Begutachtung und Kostenanträgen für Kinder, Jugendliche
  und Erwachsene mit Autismus-Spektrum-Störung; zusätzlich Eltern,
  Lehrkräfte und Betreuende. Medizinische Erstdiagnostik nicht als eigene
  Leistung; Therapie beginnt nach fachärztlicher Begutachtung und geklärter
  Kostenübernahme.

