offer: >
  Diagnostik: nur bis 4 Jahre bei Autismusfragestellung sowie zusätzlich
  eigenständige Diagnostik für Erwachsene – nicht pauschal als
  "Diagnostik Kinder & Jugendliche" zu verstehen. Daneben individuelle
  autismusspezifische Einzeltherapie, Eltern- und Institutionsberatung,
  Gruppenangebote (u. a. Multi-Familien-Therapie, Eltern- und
  Müttergruppen) und Frühförderung (seit 2016 als heilpädagogische
  Frühförderstelle Autismus anerkannt) für Menschen mit
  Autismus-Spektrum-Störungen in Bremerhaven und den umgebenden
  Landkreisen.
admissionRequirements: "Telefonisch montags bis donnerstags 09:00-12:00 Uhr erreichbar."

