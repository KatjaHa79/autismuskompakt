offer: >
  Kinder- und jugendärztliche sowie psychologische Diagnostik,
  Entwicklungsneurologie und Verhaltensbeobachtung, Therapie, Förderung und
  Beratung für Kinder und Jugendliche mit komplexen Auffälligkeiten oder
  Störungen in Entwicklung und Verhalten. Autismus wird ausdrücklich im
  medizinisch-therapeutischen Behandlungsspektrum genannt.
