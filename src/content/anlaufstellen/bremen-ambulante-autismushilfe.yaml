offer: >
  Unterstützung bei täglicher Lebensführung, sozialen Beziehungen,
  Arbeit/Beschäftigung, Tagesstruktur, Freizeit und selbstbestimmtem Wohnen
  für Menschen mit Autismus-Spektrum-Störung, die in einer eigenen Wohnung
  leben; in der Praxis überwiegend Erwachsene bzw. verselbstständigte
  Personen. Zusammenarbeit mit Angehörigen, gesetzlichen Betreuer:innen,
  Fachkräften, Ämtern und Behörden. Diagnostik: nein. Therapie nicht als
  medizinische/psychotherapeutische Therapie ausgewiesen.

