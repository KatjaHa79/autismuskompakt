offer: >
  Diagnostik und Beratung für Menschen mit Autismusverdacht; die
  Sprechstunde dient primär Diagnostik und Beratung.
admissionRequirements: >
  Aufnahme auf die Warteliste erfolgt inzwischen nur über eine ambulante
  Fachpraxis; erforderlich sind eine Checkliste zur Ersteinschätzung und
  eine Einweisung, die unmittelbar von der zuweisenden Praxis übermittelt
  werden müssen. Einzugsgebiet beschränkt: Landkreis Tübingen, umliegende
  Städte einschließlich Reutlingen und Stuttgart sowie ein näherer Umkreis
  von etwa 50 km.

