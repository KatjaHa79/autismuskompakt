offer: >
  Diagnostik und Differentialdiagnostik für Erwachsene bis 35 Jahre mit
  Verdacht auf ASS ohne Intelligenzminderung und ohne bzw. nur mit
  leichter Beeinträchtigung der funktionalen Sprache; Beratung im Rahmen
  der diagnostischen Abklärung. Kein allgemeiner Therapieplatz durch diese
  Spezialsprechstunde belegt.
admissionRequirements: >
  Erforderlich: Überweisung durch Psychiater:in oder Neurolog:in,
  Fragebögen, vorhandene Vorbefunde, Grundschulzeugnisse, ggf.
  Betreuerausweis. Vor der eigentlichen Spezialdiagnostik erfolgen zwei
  Voruntersuchungen im Diagnose- und Aufnahmezentrum. Altersgrenze bis 35
  Jahre.

