  Schulbegleitung, Tagesstruktur, Wohnen, Selbsthilfe und Fortbildungen für
  Kinder, Jugendliche und Erwachsene im Autismus-Spektrum sowie Angehörige
  und Fachkräfte. Diagnostik: ausdrücklich nein – die Beratungsstelle führt
  selbst keine Autismusdiagnostik durch und verweist an Fachstellen.

