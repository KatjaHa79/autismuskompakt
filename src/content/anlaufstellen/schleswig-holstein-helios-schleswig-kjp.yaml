  Autismusambulanz als ausgewiesene Spezialambulanz für Kinder und
  Jugendliche von 0 bis 18 Jahren, in besonderen Fällen bis 21 Jahre.
  Ambulante sowie bei Bedarf stationäre Behandlung.
admissionRequirements: >
  Überweisung durch Kinderarzt, Kinder- und Jugendpsychiater:in oder Kinder-
  und Jugendlichenpsychotherapeut:in erforderlich; ab 14 Jahren auch
  hausärztliche Überweisung möglich. Krankenkassenkarte zum Termin mitbringen.

