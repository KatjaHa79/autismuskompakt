waitingTime: >
  Stand 27.08.2026: die Anmeldung zur ASS-Sprechstunde ist seit 26.04.2024
  vorübergehend geschlossen (faktisch keine neue Aufnahme auf die
  Warteliste). Für bereits eingegangene Fälle nennt die Klinik eine
  Wartezeit von mindestens drei Jahren.

