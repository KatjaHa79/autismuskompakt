offer: >
  Diagnostik und Beratung für Menschen mit Autismusverdacht; im Klinikum
  bestehen ergänzend autismusspezifische Therapieangebote sowie eine
  Station mit ASS-Schwerpunkt (die Spezialsprechstunde selbst ist primär
  diagnostisch ausgerichtet).
admissionRequirements: >
  Die Klinik bittet ausdrücklich darum, sich nicht ersatzweise über die
  allgemeine Ambulanz anzumelden.

