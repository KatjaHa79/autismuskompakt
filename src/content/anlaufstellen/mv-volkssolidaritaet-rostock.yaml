offer: >
  Ambulante und mobile Therapie sowie Beratung, auch im familiären und
  sozialen Umfeld, für Kinder, Jugendliche und Erwachsene mit
  diagnostizierter Autismus-Spektrum-Störung sowie Familien und soziales
  Umfeld. Diagnostik: keine medizinische Erstdiagnostik als eigene
  Leistung; Therapie setzt eine Autismusdiagnose voraus.
admissionRequirements: "Auf Grundlage einer Autismusdiagnose werden die Therapiekosten laut Träger von den örtlichen Sozialhilfe- bzw. Jugendhilfeträgern übernommen."

