offer: >
  Mehrstufige leitlinienorientierte Diagnostik und Beratung für Volljährige
  mit begründetem Verdacht auf ASS. Für diagnostizierte Betroffene aus Köln
  und Umgebung: autismusspezifische Behandlungsangebote,
  Wiedereingliederungsunterstützung, Psychotherapie und moderierte
  Selbsthilfegruppen.
admissionRequirements: >
  Nur Wohnsitz in Köln und näherer Umgebung. Zugang setzt einen begründeten
  Verdacht voraus, festgestellt von Psychotherapeut:in oder Ärzt:in aus
  Psychiatrie/Neurologie bzw. ausnahmsweise Allgemeinmedizin. Vollständige
  Unterlagen sind Voraussetzung für die Warteliste.
